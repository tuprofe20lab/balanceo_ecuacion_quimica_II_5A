<style>
:root{--bg:#061226;--panel:#101f37;--line:#355275;--white:#f5faff;--muted:#b3cbe5;--cyan:#27e1fb;--gold:#ffd147;--mint:#36f4a1;--pink:#ff708d;--blue:#327df7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Segoe UI,Arial,sans-serif;color:var(--white);background:radial-gradient(ellipse at 0 0,#174f82 0,transparent 39%),radial-gradient(ellipse at 100% 100%,#25245f 0,transparent 45%),var(--bg)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:2px}.app{height:100dvh;min-height:0;display:flex;flex-direction:column;padding:clamp(8px,1.1vh,15px) clamp(12px,1.3vw,24px);gap:clamp(6px,.8vh,12px)}.top{height:clamp(46px,6.4vh,70px);flex:none;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:clamp(39px,4.6vh,54px);height:clamp(39px,4.6vh,54px);display:grid;place-items:center;background:linear-gradient(135deg,#14d5f1,#2854dd);border-radius:14px;box-shadow:0 0 26px #2edaff45;font-size:clamp(22px,3vh,30px)}.top h1{font-size:clamp(17px,2.2vw,27px);line-height:1.12;margin:0}.top small{font-size:clamp(10px,1.1vw,14px);color:#b8dbf4}.topcontrols{display:flex;gap:9px;align-items:center}.hint{color:var(--muted);font-size:clamp(11px,1vw,14px)}.mini{border:1px solid #456e98;border-radius:10px;padding:7px 12px;background:#1b3354;color:#e8f6ff;font-weight:800}.tabs{height:clamp(36px,4.7vh,52px);flex:none;display:flex;gap:7px;align-items:stretch}.tab{flex:1;min-width:0;border:1px solid #48648a;border-radius:11px;background:#1a3150;color:#bcd8ef;font-size:clamp(13px,1.3vw,18px);font-weight:900;transition:.2s}.tab:hover{background:#254d78;transform:translateY(-1px)}.tab.active{background:linear-gradient(115deg,#079ec9,#3057e7);border-color:#6ce8ff;color:white;box-shadow:0 0 18px #00aef844}.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,.88fr);gap:clamp(8px,1vw,15px)}.left,.right{min-height:0;display:flex;flex-direction:column;gap:clamp(7px,.8vh,12px)}.panel{min-height:0;background:linear-gradient(145deg,#132741,#0c1a30);border:1px solid #395878;border-radius:clamp(12px,1.2vw,18px);padding:clamp(10px,1.1vw,18px);box-shadow:0 7px 25px #0003}.problem{flex:0 0 auto}.pro-top{display:flex;justify-content:space-between;align-items:start;gap:10px}.eyebrow{font-size:clamp(10px,1vw,13px);font-weight:900;letter-spacing:.12em;color:var(--cyan)}.problem h2{font-size:clamp(15px,1.65vw,23px);line-height:1.1;margin:3px 0 5px}.prompt{font-size:clamp(11px,1.12vw,15px);color:var(--muted);margin:2px 0 0}.counter{flex:none;background:#123f45;border:1px solid #288977;border-radius:11px;color:#6affc7;font-weight:900;padding:7px 10px;max-width:40%;text-align:center;font-size:clamp(12px,1.05vw,16px)}.eq{margin-top:clamp(7px,1vh,12px);background:#06162c;border:1px solid #36678e;border-radius:12px;padding:clamp(7px,1.2vh,15px) 8px;text-align:center;font-family:Cambria Math,Georgia,serif;font-weight:bold;font-size:clamp(19px,2.45vw,37px);white-space:nowrap;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:clamp(4px,.6vw,10px);min-height:clamp(52px,7.6vh,86px)}.chem sub{font-size:.56em}.co{color:var(--gold)}.arrow{color:var(--cyan)}.plus{color:#819ec0}.exp{flex:1;min-height:0;display:flex;flex-direction:column}.progress{display:flex;gap:5px;margin-bottom:clamp(7px,1vh,12px)}.progress i{height:5px;flex:1;border-radius:6px;background:#2c4563}.progress i.on{background:linear-gradient(90deg,#17c4e2,#4ff4a6)}.explainhead{display:flex;align-items:center;gap:9px}.stepbadge{background:var(--gold);color:#102038;border-radius:9px;font-weight:1000;padding:5px 10px;font-size:clamp(13px,1.3vw,17px);white-space:nowrap}.explainhead h3{font-size:clamp(17px,1.85vw,25px);margin:0;line-height:1.18}.bodytxt{font-size:clamp(14px,1.5vw,21px);line-height:1.35;margin:clamp(8px,1.4vh,16px) 0;overflow:hidden}.note{font-size:clamp(12px,1.14vw,16px);line-height:1.24;background:#174065;border-left:4px solid var(--cyan);padding:clamp(7px,1vh,12px);border-radius:8px;color:#d9ebfc;margin-top:auto}.footnav{display:flex;gap:9px;align-items:center;margin-top:clamp(8px,1.2vh,14px)}.btn{border:0;border-radius:11px;padding:clamp(8px,1vh,12px) 12px;background:linear-gradient(120deg,#08a4d0,#2f67e7);color:white;font-weight:900;font-size:clamp(12px,1.12vw,16px)}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.alt{background:#253d5f;border:1px solid #50729a}.footnav .grow{flex:1}.footnav .grow button{width:100%}.footnav .stepn{font-weight:900;color:#bce2ff;font-size:clamp(12px,1.2vw,17px);white-space:nowrap}.diagram{flex:1.2;min-height:0;display:flex;flex-direction:column}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.sectionhead strong{font-size:clamp(13px,1.3vw,19px);color:#f5d45a}.sectionhead span{color:#a9d6f1;font-size:clamp(10px,.98vw,13px)}.scene{flex:1;min-height:0;margin-top:8px;border-radius:12px;background:#06182f;border:1px solid #2b4d70;overflow:hidden}.scene svg{display:block;width:100%;height:100%}.atompanel{flex:0 0 auto}.atomhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:clamp(12px,1.15vw,16px)}.atomhead strong{color:var(--cyan)}.atomhead span{font-weight:900;color:var(--gold)}.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.count{display:flex;align-items:center;gap:6px;background:#172f4b;border-radius:8px;border:1px solid #325a7b;padding:clamp(3px,.55vh,7px) 8px;font-size:clamp(11px,1.05vw,15px);font-weight:850}.symbol{width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;color:#081326}.nums{flex:1;text-align:center;white-space:nowrap}.mark{font-size:17px}.equal{color:var(--mint)}.unequal{color:#ff8799}.lab{flex:0 0 auto}.lab-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}.lab-top strong{color:var(--cyan);font-size:clamp(12px,1.2vw,16px)}.lab-top span{font-size:clamp(10px,.9vw,13px);color:var(--muted)}.controls{display:flex;gap:clamp(6px,.6vw,9px);align-items:center;justify-content:space-between}.control{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}.form{font-family:Georgia,serif;font-size:clamp(11px,1vw,15px)}.nctrl{width:100%;display:flex;align-items:center;justify-content:center;gap:3px}.nctrl button{border:1px solid #5a83b7;background:#284975;color:white;width:clamp(25px,2.2vw,35px);height:clamp(26px,2.3vw,35px);border-radius:7px;font-size:19px;font-weight:900}.value{color:#ffd251;background:#061a32;border:1px solid #476b91;min-width:clamp(25px,2.4vw,39px);text-align:center;border-radius:6px;font-weight:1000;padding:4px 2px}.labfoot{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:8px}.status{font-size:clamp(11px,1vw,15px);font-weight:900}.smallbtn{font-size:clamp(11px,1vw,14px);padding:6px 9px}.pulse{animation:pulse .7s ease}.particle{transition:all .3s}@keyframes pulse{0%{filter:brightness(1.8)}100%{filter:brightness(1)}}@media (max-height:760px){.app{gap:5px;padding:5px 12px}.top{height:40px}.tabs{height:35px}.panel{padding:9px}.problem h2{margin:0 0 3px}.eq{margin-top:4px;min-height:49px}.bodytxt{margin:6px 0}.note{padding:6px}.footnav{margin-top:5px}.scene{margin-top:5px}.count{padding:2px 7px}.labfoot{margin-top:5px}}@media(max-width:850px){.work{grid-template-columns:1.1fr 1fr}.hint{display:none}.top h1{font-size:16px}.eq{font-size:clamp(15px,2vw,23px)}.control .form{font-size:10px}.nctrl button{width:22px;height:27px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">⚗</div><div><h1><span style="color:#42e8ff">TuProfe20 Lab</span> · Balanceo químico</h1><small>QUÍMICA · 5.º DE SECUNDARIA · MÉTODO DE TANTEO</small></div></div><div class="topcontrols"><span class="hint">← → cambiar paso · 1–7 ejercicio</span><button class="mini" id="fs" title="Pantalla completa">⛶ Pantalla completa</button></div></header><nav class="tabs" id="tabs" aria-label="Ejercicios"></nav><main class="work"><section class="left"><div class="panel problem"><div class="pro-top"><div><div class="eyebrow" id="nex">EJERCICIO 1</div><h2 id="title"></h2><p class="prompt" id="prompt"></p></div><div class="counter" id="answer">RESULTADO</div></div><div class="eq" id="equation"></div></div><div class="panel exp"><div class="progress" id="progress"></div><div class="explainhead"><span class="stepbadge" id="badge">INICIO</span><h3 id="stepTitle"></h3></div><div class="bodytxt" id="stepBody"></div><div class="note" id="note"></div><div class="footnav"><button class="btn alt" id="prev">← Anterior</button><div class="stepn" id="stepnumber"></div><div class="grow"><button class="btn" id="next">Siguiente paso →</button></div><button class="btn alt" id="restart" title="Reiniciar">↺</button></div></div></section><aside class="right"><div class="panel diagram"><div class="sectionhead"><strong>⚛ ESQUEMA DE PARTÍCULAS</strong><span>Átomos por fórmula · × coeficiente</span></div><div class="scene"><svg viewBox="0 0 700 270" preserveAspectRatio="xMidYMid meet" id="scene" aria-label="Modelo esquemático de las sustancias"></svg></div></div><div class="panel atompanel"><div class="atomhead"><strong>CONSERVACIÓN DE ÁTOMOS</strong><span id="summary"></span></div><div class="counts" id="counts"></div></div><div class="panel lab"><div class="lab-top"><strong>AJUSTA LOS COEFICIENTES</strong><span>+ / − modifica las cantidades</span></div><div class="controls" id="controls"></div><div class="labfoot"><span class="status" id="status"></span><button class="btn alt smallbtn" id="restore">↺ Volver al paso</button></div></div></aside></main></div><script>
const raw=[
{id:'01',title:'Carburo de aluminio y agua',page:4,prompt:'Balancea por tanteo y calcula la suma de los coeficientes de los productos.',L:[['Al4C3',{Al:4,C:3}],['H2O',{H:2,O:1}]],R:[['CH4',{C:1,H:4}],['Al2O3',{Al:2,O:3}]],choices:['12','7','5','3'],correct:2,answer:'La ecuación final es Al₄C₃ + 6H₂O → 3CH₄ + 2Al₂O₃. Suma en los productos: 3 + 2 = 5.',steps:[[[1,1],[1,1],'Lectura inicial','Al: 4 a la izquierda y 2 a la derecha; C: 3 y 1. H y O tampoco coinciden.','Empezamos por aluminio (Al), que aparece en una sustancia de cada lado.'],[[1,1],[1,2],'Paso 1 · Balancear aluminio','Hay 4 Al en Al₄C₃. Cada Al₂O₃ aporta 2 Al: colocamos 2 delante de Al₂O₃ (2 × 2 = 4).','No se cambia el subíndice 2 del óxido.'],[[1,1],[3,2],'Paso 2 · Balancear carbono','Hay 3 carbonos en Al₄C₃ y 1 por CH₄: colocamos 3 delante de CH₄ (3 × 1 = 3).','Ahora el metano aporta 3 × 4 = 12 átomos de H.'],[[1,6],[3,2],'Paso 3 · Balancear hidrógeno','Se requieren 12 H en los reactantes. Cada agua tiene 2 H: 12 ÷ 2 = 6 H₂O.','Verificación de oxígeno: 6 a la izquierda y 2 × 3 = 6 a la derecha.'],[[1,6],[3,2],'Paso 4 · Concluir y responder','Al: 4 = 4; C: 3 = 3; H: 12 = 12; O: 6 = 6. Suma de los coeficientes de los PRODUCTOS: 3 + 2 = 5.','Resultado: 5.']]},
{id:'02',title:'Ácido fosfórico e hidróxido de bismuto',page:4,prompt:'Balancea e identifica el coeficiente del agua.',L:[['H3PO4',{H:3,P:1,O:4}],['Bi(OH)5',{Bi:1,O:5,H:5}]],R:[['Bi3(PO4)5',{Bi:3,P:5,O:20}],['H2O',{H:2,O:1}]],choices:['5','10','15','30'],correct:2,answer:'5H₃PO₄ + 3Bi(OH)₅ → Bi₃(PO₄)₅ + 15H₂O. El coeficiente del agua es 15.',steps:[[[1,1],[1,1],'Lectura inicial','En Bi₃(PO₄)₅ hay 3 Bi, 5 P y 20 O. Los paréntesis multiplican a todos los átomos interiores.','Primero equilibramos los grupos que aparecen intactos.'],[[1,3],[1,1],'Paso 1 · Bismuto','En el producto hay 3 Bi. Cada Bi(OH)₅ contiene un Bi: colocamos coeficiente 3.','El total de hidróxidos (OH) pasa a 3 × 5 = 15.'],[[5,3],[1,1],'Paso 2 · Fosfato','El producto tiene 5 grupos PO₄. Colocamos 5 delante de H₃PO₄: 5 P a ambos lados.','En los reactantes, H = 5 × 3 + 3 × 5 = 30.'],[[5,3],[1,15],'Paso 3 · Agua','Para obtener 30 H en el producto, hacen falta 15 moléculas H₂O: 15 × 2 = 30.','El oxígeno también coincide: izquierda 5 × 4 + 3 × 5 = 35; derecha 20 + 15 = 35.'],[[5,3],[1,15],'Paso 4 · Verificación','Bi: 3 = 3; P: 5 = 5; O: 35 = 35; H: 30 = 30. Coeficiente del H₂O: 15.','Resultado: 15.']]},
{id:'03',title:'Combustión del benceno',page:4,prompt:'Balancea y señala el coeficiente del O₂.',L:[['C6H6',{C:6,H:6}],['O2',{O:2}]],R:[['CO2',{C:1,O:2}],['H2O',{H:2,O:1}]],choices:['7','10','12','15'],correct:3,answer:'2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O. El coeficiente del O₂ es 15.',steps:[[[1,1],[1,1],'Lectura inicial','Se dejan los oxígenos para el final porque aparecen en dos sustancias de los productos.','Comenzamos por carbono y luego hidrógeno.'],[[1,1],[6,1],'Paso 1 · Carbono','C₆H₆ contiene 6 átomos de C. Colocamos 6 delante de CO₂.','Ahora la derecha tiene 6 C.'],[[1,1],[6,3],'Paso 2 · Hidrógeno','C₆H₆ contiene 6 H; cada agua aporta 2 H. Se necesitan 3 H₂O.','En productos hay 6 × 2 + 3 × 1 = 15 oxígenos.'],[[1,1],[6,3],'Paso 3 · Oxígeno fraccionario','Para aportar 15 oxígenos con O₂ sería necesario 15/2 O₂. Es un coeficiente provisional fraccionario.','La ficha indica que los coeficientes finales deben ser enteros.'],[[2,15],[12,6],'Paso 4 · Multiplicar por 2','Multiplicamos TODOS los coeficientes por 2: 2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O.','C: 12 = 12; H: 12 = 12; O: 30 = 30. Resultado: 15.']]},
{id:'04',title:'Reducción del óxido de hierro',page:4,prompt:'Balancea y halla la suma de los coeficientes de CO y CO₂.',L:[['Fe2O3',{Fe:2,O:3}],['CO',{C:1,O:1}]],R:[['Fe',{Fe:1}],['CO2',{C:1,O:2}]],choices:['3','6','8','10'],correct:1,answer:'Fe₂O₃ + 3CO → 2Fe + 3CO₂. Coeficientes de CO y CO₂: 3 + 3 = 6.',steps:[[[1,1],[1,1],'Lectura inicial','Fe₂O₃ contiene 2 Fe y 3 O. CO y CO₂ contienen carbono y oxígeno.','Empezamos por hierro (metal).'],[[1,1],[2,1],'Paso 1 · Hierro','Cada Fe₂O₃ contiene 2 Fe; colocamos 2 delante del hierro del producto.','Quedan 2 Fe en ambos miembros.'],[[1,3],[2,3],'Paso 2 · Carbono y oxígeno','Cada CO que se transforma en CO₂ toma un oxígeno adicional. Fe₂O₃ aporta 3 oxígenos: se necesitan 3 CO y se producen 3 CO₂.','C: 3 = 3; O: 3 + 3 = 6 y 3 × 2 = 6.'],[[1,3],[2,3],'Paso 3 · Responder','Fe₂O₃ + 3CO → 2Fe + 3CO₂. Se piden los coeficientes de CO y CO₂, no la suma de todos.','3 + 3 = 6. Resultado: 6.']]},
{id:'05',title:'Combustión general de CₓH₂ₓ',page:5,prompt:'Determina el coeficiente del O₂ en función de x. Se muestran las cantidades generales y un ejemplo visual con x = 2.',L:[['CxH2x',{C:2,H:4}],['O2',{O:2}]],R:[['CO2',{C:1,O:2}],['H2O',{H:2,O:1}]],choices:['x','2x','3x','4x'],correct:2,answer:'Con coeficientes enteros para x natural general: 2CₓH₂ₓ + 3xO₂ → 2xCO₂ + 2xH₂O. En la forma general entera, el coeficiente es 3x.',steps:[[[1,1],[1,1],'Lectura general','El compuesto tiene x carbonos y 2x hidrógenos. Para mostrar esferas, usaremos el ejemplo x = 2 (C₂H₄), sin cambiar el planteamiento simbólico.','El ejercicio pregunta por la expresión del coeficiente de O₂.'],[[1,1],[2,1],'Paso 1 · Carbono','Simbólicamente: CₓH₂ₓ → xCO₂. Para x=2, se forman 2 CO₂.','Así se equilibran los x carbonos.'],[[1,1],[2,2],'Paso 2 · Hidrógeno','2x átomos de H obligan a colocar x H₂O. En x=2 corresponden 2 aguas.','Oxígenos del producto en general: 2x + x = 3x.'],[[1,3],[2,2],'Paso 3 · Oxígeno: caso x=2','En el ejemplo x=2 hacen falta 3 O₂ para obtener 6 átomos de oxígeno. En general el coeficiente provisional es 3x/2.','El coeficiente 3x/2 puede ser entero si x es par, pero no para todo x natural.'],[[2,6],[4,4],'Paso 4 · Forma general entera','Multiplicamos la expresión general por 2: 2CₓH₂ₓ + 3xO₂ → 2xCO₂ + 2xH₂O. Para x=2, la ecuación mostrada tiene coeficientes 2, 6, 4, 4.','Respuesta: 3x. Para valores específicos pares de x, se pueden simplificar los coeficientes.']]},
{id:'06',title:'Combustión del trisulfuro de tetrafósforo',page:5,prompt:'Balancea P₄S₃ + O₂ → P₄O₁₀ + SO₂ y suma todos los coeficientes.',L:[['P4S3',{P:4,S:3}],['O2',{O:2}]],R:[['P4O10',{P:4,O:10}],['SO2',{S:1,O:2}]],choices:['4','8','10','13'],correct:3,answer:'P₄S₃ + 8O₂ → P₄O₁₀ + 3SO₂. Suma: 1 + 8 + 1 + 3 = 13.',steps:[[[1,1],[1,1],'Lectura inicial','P₄S₃ tiene 4 P y 3 S. El producto P₄O₁₀ conserva 4 P, pero el S aún no está equilibrado.','Dejamos el oxígeno al final.'],[[1,1],[1,1],'Paso 1 · Fósforo','P₄S₃ y P₄O₁₀ ya contienen 4 átomos de fósforo por fórmula. Sus coeficientes pueden quedar en 1.','P: 4 = 4.'],[[1,1],[1,3],'Paso 2 · Azufre','En reactivos hay 3 S. Cada SO₂ aporta 1 S: colocamos coeficiente 3.','Esto aporta 3 × 2 = 6 átomos de O en SO₂.'],[[1,8],[1,3],'Paso 3 · Oxígeno','Oxígenos de los productos: 10 + 6 = 16. Cada O₂ contiene 2 O, por tanto se necesitan 16 ÷ 2 = 8 O₂.','P: 4 = 4, S: 3 = 3, O: 16 = 16.'],[[1,8],[1,3],'Paso 4 · Respuesta','La ecuación final es P₄S₃ + 8O₂ → P₄O₁₀ + 3SO₂. Suma total: 1 + 8 + 1 + 3 = 13.','Resultado: 13.']]},
{id:'07',title:'Modelo de partículas A y B',page:5,prompt:'Interpreta el diagrama de esferas: A corresponde a las parejas moradas y B a las esferas rojas.',L:[['A2',{A:2}],['B',{B:1}]],R:[['A2B',{A:2,B:1}]],choices:['A₂ + 4B → 2AB₂','2A + B₄ → 2AB₂','A + B₂ → AB₂','A₂ + B → A₂B'],correct:3,answer:'En el dibujo: 4 moléculas A₂ + 4 átomos B → 4 moléculas A₂B. Simplificamos dividiendo todos los coeficientes entre 4: A₂ + B → A₂B (alternativa D).',steps:[[[4,4],[4],'Paso 1 · Leer el diagrama','A la izquierda se observan cuatro pares morados (4A₂) y cuatro esferas rojas sueltas (4B). A la derecha se forman cuatro agrupaciones con dos moradas y una roja (4A₂B).','Las esferas moradas representan A y las rojas B.'],[[4,4],[4],'Paso 2 · Contar átomos','Reactivos: A = 4 × 2 = 8; B = 4. Productos: A = 4 × 2 = 8; B = 4.','La representación ya conserva la cantidad de partículas de cada elemento.'],[[1,1],[1],'Paso 3 · Simplificar coeficientes','La reacción observada 4A₂ + 4B → 4A₂B se divide entre 4: A₂ + B → A₂B.','La proporción mínima entera es 1 : 1 : 1.'],[[1,1],[1],'Paso 4 · Identificar alternativa','A₂ + B → A₂B. Una molécula de A₂ reacciona con un átomo de B para formar una unidad A₂B.','Resultado: A₂ + B → A₂B.']]}];

const E=raw.map((e)=>({...e,steps:e.steps.map(s=>({l:s[0],r:s[1],title:s[2],body:s[3],note:s[4]}))}));
const palette={Al:'#66e3fa',C:'#77e6a5',H:'#f5faff',O:'#ff627c',Bi:'#cd94ff',P:'#ffad55',Fe:'#ffac6e',S:'#ffe15c',A:'#a67bff',B:'#ff6285'};
let current=0,step=0,L=[],R=[];const $=id=>document.getElementById(id);
function fm(f){if(f==='CxH2x')return 'C<sub>x</sub>H<sub>2x</sub>';return f.replace(/(\d+)/g,'<sub>$1</sub>')}
function species(a,c){return a.map((sp,i)=>`<span class="chem"><span class="co">${c[i]===1?'':c[i]}</span>${fm(sp[0])}</span>`).join(' <span class="plus">+</span> ')}
function counts(items,vals){const t={};items.forEach((s,i)=>Object.entries(s[1]).forEach(([k,v])=>t[k]=(t[k]||0)+v*vals[i]));return t}
function balance(){const l=counts(E[current].L,L),r=counts(E[current].R,R);return Object.keys({...l,...r}).every(k=>l[k]===r[k])}
function exercise(n){current=n;step=0;setStep()}
function setStep(){const s=E[current].steps[step];L=[...s.l];R=[...s.r];render()}
function move(x){if(step+x>=0&&step+x<E[current].steps.length){step+=x;setStep()}}
function setCoeff(side,i,delta){const a=side==='L'?L:R;a[i]=Math.max(1,Math.min(99,a[i]+delta));render(true)}
function showEquation(){const e=E[current];$('equation').innerHTML=species(e.L,L)+' <span class="arrow">→</span> '+species(e.R,R);}
function getAnswer(e){return ['3 + 2 = 5','H₂O = 15','O₂ = 15','3 + 3 = 6','O₂ = 3x','1 + 8 + 1 + 3 = 13','A₂ + B → A₂B'][current]}
function render(manual=false){let e=E[current],s=e.steps[step];$('tabs').innerHTML=E.map((_,i)=>`<button class="tab ${i===current?'active':''}" onclick="exercise(${i})">${i+1}</button>`).join('');$('nex').textContent='EJERCICIO '+(current+1);$('title').textContent=e.title;$('prompt').textContent=e.prompt;$('answer').textContent=step===e.steps.length-1?getAnswer(e):'OBJETIVO: '+['SUMA','H₂O','O₂','SUMA','O₂','SUMA','MODELO'][current];$('progress').innerHTML=e.steps.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');$('badge').textContent=step===0?'INICIO':'PASO '+step;$('stepTitle').textContent=s.title.replace(/^Paso \d+ · /,'');$('stepBody').textContent=s.body;$('note').innerHTML='<b style="color:#70e9ff">CLAVE:</b> '+s.note;$('prev').disabled=step===0;$('next').disabled=step===e.steps.length-1;$('next').textContent=step===e.steps.length-2?'Ver resultado →':'Siguiente paso →';$('stepnumber').textContent=(step+1)+' / '+e.steps.length;showEquation();showCounts();showControls();drawScene();if(manual){$('status').classList.add('pulse');setTimeout(()=>$('status').classList.remove('pulse'),450)}}
function showCounts(){const l=counts(E[current].L,L),r=counts(E[current].R,R),keys=Object.keys({...l,...r});$('counts').innerHTML=keys.map(k=>{let ok=l[k]===r[k];return `<div class="count"><span class="symbol" style="background:${palette[k]||'#dfefff'}">${k}</span><span class="nums">${l[k]||0} <span style="color:#86a8c4">↔</span> ${r[k]||0}</span><span class="mark ${ok?'equal':'unequal'}">${ok?'✓':'✕'}</span></div>`}).join('');const ok=balance();$('summary').textContent=keys.filter(k=>l[k]===r[k]).length+'/'+keys.length+' iguales';$('status').innerHTML=ok?'<span class="equal">✓ ECUACIÓN BALANCEADA</span>':'<span class="unequal">● FALTAN ÁTOMOS POR IGUALAR</span>'}
function showControls(){const e=E[current];$('controls').innerHTML=[...e.L.map((s,i)=>({s,i,side:'L',n:L[i]})),...e.R.map((s,i)=>({s,i,side:'R',n:R[i]}))].map(x=>`<div class="control"><span class="form">${fm(x.s[0])}</span><div class="nctrl"><button aria-label="Restar coeficiente" onclick="setCoeff('${x.side}',${x.i},-1)">−</button><span class="value">${x.n}</span><button aria-label="Sumar coeficiente" onclick="setCoeff('${x.side}',${x.i},1)">+</button></div></div>`).join('')}
function atom(cx,cy,r,color){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="white" stroke-opacity=".45" stroke-width="1.6"/><circle cx="${cx-r*.25}" cy="${cy-r*.28}" r="${r*.3}" fill="#fff" fill-opacity=".34"/>`}
function molecule(s,centerX,centerY,width){let atoms=[];Object.entries(s[1]).forEach(([k,n])=>{for(let i=0;i<Math.min(n,22);i++)atoms.push(k)});const count=atoms.length,cols=Math.ceil(Math.sqrt(count)),rows=Math.ceil(count/cols),spacing=Math.min(21,(width-12)/Math.max(cols,1)),yspacing=19;return atoms.map((a,i)=>atom(centerX+(i%cols-(cols-1)/2)*spacing,centerY+(Math.floor(i/cols)-(rows-1)/2)*yspacing,Math.min(10,spacing*.46),palette[a]||'#c8d9f0')).join('')}
function drawScene(){let e=E[current],svg=[];svg.push('<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#102d4a"/><stop offset="1" stop-color="#0b203a"/></linearGradient></defs>');svg.push('<rect width="344" height="266" x="3" y="2" rx="15" fill="url(#bg)" stroke="#3e638b"/><rect width="344" height="266" x="352" y="2" rx="15" fill="url(#bg)" stroke="#3e638b"/>');svg.push('<text x="175" y="33" fill="#37e1f7" text-anchor="middle" font-size="19" font-weight="900">REACTANTES</text><text x="525" y="33" fill="#ffd456" text-anchor="middle" font-size="19" font-weight="900">PRODUCTOS</text>');const all=[{arr:e.L,coeff:L,start:10},{arr:e.R,coeff:R,start:359}];all.forEach(side=>{const n=side.arr.length;side.arr.forEach((s,i)=>{let cx=side.start+(i+.5)*(332/n);svg.push(molecule(s,cx,124,310/n));svg.push(`<text x="${cx}" y="206" fill="#e6f5ff" text-anchor="middle" font-size="${n===2?20:17}" font-weight="700">${s[0]==='CxH2x'?'CₓH₂ₓ':s[0].replace(/(\d+)/g,(_,a)=>'₀₁₂₃₄₅₆₇₈₉'[Number(a)]||a)}</text><rect x="${cx-42}" y="222" width="84" height="31" rx="9" fill="#173d61" stroke="#44779b"/><text x="${cx}" y="244" fill="#ffe06b" text-anchor="middle" font-weight="900" font-size="17">× ${side.coeff[i]}</text>`)} )});
if(current===6&&step<=1){ // Show actual four diagrammatic groups in initial states
svg=[];svg.push('<rect width="344" height="266" x="3" y="2" rx="15" fill="#102d4a" stroke="#3e638b"/><rect width="344" height="266" x="352" y="2" rx="15" fill="#102d4a" stroke="#3e638b"/><text x="175" y="32" fill="#42e4ff" text-anchor="middle" font-size="18" font-weight="900">4 A₂ + 4 B</text><text x="525" y="32" fill="#ffd456" text-anchor="middle" font-size="18" font-weight="900">4 A₂B</text>');for(let i=0;i<4;i++){let x=54+(i%2)*143,y=88+Math.floor(i/2)*91;svg.push(atom(x,y,11,palette.A),atom(x+23,y,11,palette.A),atom(x+66,y+2,12,palette.B));let p=408+(i%2)*141;svg.push(atom(p,y,11,palette.A),atom(p+24,y,12,palette.B),atom(p+48,y,11,palette.A))}svg.push('<text x="175" y="251" fill="#bcd9f4" font-size="16" text-anchor="middle">8 átomos A · 4 átomos B</text><text x="525" y="251" fill="#bcd9f4" font-size="16" text-anchor="middle">8 átomos A · 4 átomos B</text>')}
$('scene').innerHTML=svg.join('')}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('restart').onclick=()=>{step=0;setStep()};$('restore').onclick=setStep;$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')move(1);else if(ev.key==='ArrowLeft')move(-1);else if(/^[1-7]$/.test(ev.key))exercise(Number(ev.key)-1)});exercise(0);
</script></body></html>
